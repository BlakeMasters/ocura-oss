name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC: catch breakage from new runner images and Python releases.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install -e .
      - name: Run the test suite
        run: python -m unittest discover -s tests

  package:
    name: Lint, types, and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the package and development tools
        run: python -m pip install -e . build mypy ruff twine
      - name: Lint
        run: python -m ruff check src tests tools examples
      - name: Check formatting
        run: python -m ruff format --check src tests tools examples
      - name: Check types
        run: python -m mypy src/ocura_oss
      - name: Check version, changelog, and documentation agree
        run: python tools/check_release.py
      - name: Build the distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check the built distributions
        run: python tools/check_release.py --dist dist
      - name: Keep the distributions for the install jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  installed:
    name: Installed ${{ matrix.kind }} (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install the built wheel
        if: matrix.kind == 'wheel'
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Install the built source distribution
        if: matrix.kind == 'sdist'
        shell: bash
        run: python -m pip install dist/*.tar.gz
      - name: Confirm the tests will import the installed copy
        run: >-
          python -c "import ocura_oss, pathlib;
          path = pathlib.Path(ocura_oss.__file__);
          assert 'site-packages' in path.parts, path;
          print(ocura_oss.__version__, path)"
      - name: Run the test suite against the installed package
        run: python -m unittest discover -s tests

  quickstart:
    name: README workflow (${{ matrix.os }}, ${{ matrix.shell }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Run the README workflow in bash
        if: matrix.shell == 'bash'
        shell: bash
        run: bash .github/scripts/quickstart.sh
      - name: Run the README workflow in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./.github/scripts/quickstart.ps1
      - name: Run the README workflow in Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./.github/scripts/quickstart.ps1

  examples:
    name: Example integration (PyTorch and JAX on CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the package and the CPU example backends
        run: >-
          python -m pip install -e .
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r examples/autoregressive/requirements-pytorch.txt
          -r examples/autoregressive/requirements-jax.txt
      - name: Run the example tests that the main suite skips
        env:
          OCURA_OSS_EXAMPLE_TESTS: local
        run: python -m unittest -v tests.test_autoregressive_example
