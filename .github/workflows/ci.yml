name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install -e .
      - name: Run the test suite
        run: python -m unittest discover -s tests

  package:
    name: Lint, types, and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the package and development tools
        run: python -m pip install -e . build mypy ruff twine
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Check formatting
        run: python -m ruff format --check src tests tools
      - name: Check types
        run: python -m mypy src/ocura_oss
      - name: Check version, changelog, and documentation agree
        run: python tools/check_release.py
      - name: Build the distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check the built distributions
        run: python tools/check_release.py --dist dist
