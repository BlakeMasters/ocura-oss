name: Release

# Pushing a vX.Y.Z tag checks, builds, and publishes that version. PyPI accepts
# the upload through Trusted Publishing: the project must list this repository,
# this workflow file, and the "pypi" environment as a trusted publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install the package and build tools
        run: python -m pip install -e . build twine
      - name: Check the tag against version, changelog, and documentation
        run: python tools/check_release.py --tag "$TAG"
      - name: Run the test suite
        run: python -m unittest discover -s tests
      - name: Build the distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check the built distributions
        run: python tools/check_release.py --tag "$TAG" --dist dist
      - name: Extract the release notes
        run: python tools/check_release.py --notes > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ocura-oss/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the release
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Ocura OSS ${TAG#v}"
          --notes-file release-notes.md
          --verify-tag
