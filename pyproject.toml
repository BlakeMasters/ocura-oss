[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ocura-oss"
version = "0.4.0"
description = "A local execution ledger for recording, branching, and comparing command runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/BlakeMasters/ocura-oss"
Repository = "https://github.com/BlakeMasters/ocura-oss"
Issues = "https://github.com/BlakeMasters/ocura-oss/issues"
Changelog = "https://github.com/BlakeMasters/ocura-oss/blob/main/CHANGELOG.md"
Documentation = "https://ocuna-ai.com/docs"
Security = "https://github.com/BlakeMasters/ocura-oss/blob/main/SECURITY.md"

[project.scripts]
ocura-oss = "ocura_oss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocura_oss = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/ocura_oss"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
